version: '3.8'

services:
  # --- JobPulse AI Core Application ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobpulse_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-JobPulse Candidate}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      - db_data:/app/data
      - output_data:/app/output
      - ./latex:/app/latex
    networks:
      - jobpulse_network

  # --- n8n Workflow Automation Platform ---
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jobpulse_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    depends_on:
      - app
    networks:
      - jobpulse_network

networks:
  jobpulse_network:
    driver: bridge

volumes:
  db_data:
  output_data:
  n8n_data:
